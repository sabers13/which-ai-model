[project]
name = "which-ai-model"
version = "0.1.0"
description = "Which AI model should each tool use — and how do you switch without rewriting everything?"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Saber Sojudi" }]
keywords = ["langchain", "langgraph", "benchmark", "byok"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  # Shared model layer (LangChain v1 / LangGraph v1)
  "langchain[mcp]==1.4.7",
  "langgraph==1.2.18",
  "langchain-openai==1.7.3",
  "langchain-anthropic==1.7.7",
  "langchain-google-genai==4.4.2",
  "mcp==2.3.0",
  # Provider SDKs (BYOK probe + legacy tools)
  "httpx==0.28.1",
  "anthropic==2.3.0",
  "google-genai==2.33.0",
  "openai==3.40.0",
  # Data and benchmark
  "pandas==3.1.0",
  "pyarrow==26.0.0",
  "scikit-learn==1.9.1",
  "numpy==2.5.4",
  # RAG (CPU embeddings, Postgres + pgvector). torch is pinned directly so uv applies
  # the CPU-only index in [tool.uv.sources]; a transitive torch would resolve to the
  # multi-gigabyte CUDA build from PyPI.
  "sentence-transformers==6.2.0",
  "torch==2.9.1",
  "psycopg[binary]==3.3.6",
  "pgvector==0.5.1",
  # CLI and page
  "typer==0.27.3",
  "rich==15.0.0",
  "jinja2==3.1.6",
  # Contracts
  "pydantic==2.14.1",
]

[project.scripts]
wam = "which_ai_model.cli:app"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-socket==0.8.1",
  "ruff==0.17.3",
  "mypy==2.4.0",
  "pandas-stubs==3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/which_ai_model"]

[tool.uv]
# CPU-only PyTorch: the RAG embeddings run on CPU, and the CUDA wheels are several GB.
# The extra index is used for `torch` only; every other package comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --disable-socket --allow-unix-socket"
markers = [
  "slow: long-running test (still offline)",
]
filterwarnings = [
  "error::DeprecationWarning:which_ai_model.*",
  "error::DeprecationWarning:tests.*",
]
log_cli_level = "INFO"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["dist", "web", "data"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "PT", "RET",
  "SIM", "PTH", "RUF",
]
ignore = [
  "E501",   # line length is enforced by the formatter
  "B008",   # typer uses function calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]        # command-line scripts may print
"src/which_ai_model/cli.py" = ["T201"]
"tests/*" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
files = ["src"]
mypy_path = "src"
plugins = []
exclude = ["^\\.venv/", "^dist/", "^web/"]

[[tool.mypy.overrides]]
# Third-party packages without PEP 561 markers. Keep this list short and explained:
# every entry is a package we import but cannot type-check. `which_ai_model` itself is
# always checked strictly.
module = [
  "pgvector.*",
  "sentence_transformers.*",
]
ignore_missing_imports = true
