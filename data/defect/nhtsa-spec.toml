# Licence (quoted evidence; full URLs and retrieval date in report.md)
# --------------------------------------------------------------------------
[licence]
status = "us-government-work-public-domain"
redistribution_allowed = true
statement_ownership = "Information presented on this web site is considered public information and may be distributed or copied."
statement_ownership_source = "https://www.nhtsa.gov/about-nhtsa/privacy-policy (section Ownership; retrieved 2026-10-31)"
statement_catalog = "Public: This dataset is intended for public access and use. License: us-pd"
statement_catalog_source = "https://catalog.data.gov/dataset/nhtsas-office-of-defects-investigation-odi-complaints and ...-odi-recalls (retrieved 2026-10-31)"
license_uri = "http://www.usa.gov/publicdomain/label/1.0/"
privacy_note = "Public-domain status covers the government record. Complaints contain personal data contributed by the public; privacy and publicity rights can still apply. Identity and location columns are dropped and narratives that match a PII pattern are discarded, never committed."

