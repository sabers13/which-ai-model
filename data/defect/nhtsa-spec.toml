# nhtsa-spec.toml -- binding data specification for the NHTSA ODI snapshot 2026-10-31.
# Normative file. which-ai-model (T-DEFECT) and field-return-triage copy this file
# and groups.toml byte for byte. Do not edit a copy per repo.
#
# Downstream repos treat their committed derived files as the source of truth.
# A fresh download whose sha256 differs from the values below is a warning, never
# a stop, and never silently replaces committed derived files.

schema = "nhtsa-odi-snapshot-spec"
version = 1
snapshot = "2026-10-31"
snapshot_dir = "data/raw/nhtsa-snapshot/2026-10-31"

